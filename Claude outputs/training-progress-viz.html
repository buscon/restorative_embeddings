<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable Audio 3 LoRA Training Progress</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --surface-light: #ffffff;
            --surface-dark: #1a1a1a;
            --text-primary: #1a1a1a;
            --text-muted: #666666;
            --loss-primary: #0066cc;
            --loss-context: #cc0000;
            --loss-masked: #ff9900;
            --loss-signal: #00aa00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface-light: #0f0f0f;
                --surface-dark: #1a1a1a;
                --text-primary: #e0e0e0;
                --text-muted: #999999;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--surface-dark);
            color: var(--text-primary);
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .upload-section {
            background: var(--surface-light);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .upload-section textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            box-sizing: border-box;
            background: #f5f5f5;
            color: #000;
        }

        .upload-section input[type="file"] {
            margin-bottom: 12px;
        }

        button {
            background: var(--loss-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.9;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .chart-container {
            background: var(--surface-light);
            padding: 16px;
            border-radius: 8px;
            position: relative;
            height: 400px;
        }

        .chart-container.full {
            grid-column: 1 / -1;
        }

        .chart-container h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .stats {
            background: var(--surface-light);
            padding: 16px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--loss-primary);
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
        }

        .info {
            background: #eef;
            color: #006;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stable Audio 3 LoRA Training Progress</h1>

        <div class="upload-section">
            <h2 style="margin-top: 0; font-size: 16px;">Upload metrics.csv</h2>
            <input type="file" id="csvFile" accept=".csv">
            <button onclick="handleFileUpload()">Load from File</button>
            <p style="color: var(--text-muted); margin: 12px 0; font-size: 14px;">Or paste CSV content below:</p>
            <textarea id="csvContent" placeholder="Paste your metrics.csv content here..."></textarea>
            <button onclick="handlePaste()">Load from Paste</button>
        </div>

        <div id="chartsContainer"></div>
        <div id="statsContainer"></div>
        <div id="errorContainer"></div>
    </div>

    <script>
        let chart = null;

        function handleFileUpload() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('csvContent').value = e.target.result;
                handlePaste();
            };
            reader.readAsText(file);
        }

        function handlePaste() {
            const csv = document.getElementById('csvContent').value;
            if (!csv.trim()) {
                showError('Please paste or load CSV content');
                return;
            }

            try {
                const data = parseCSV(csv);
                visualizeTraining(data);
                document.getElementById('errorContainer').innerHTML = '';
            } catch (error) {
                showError(`Error parsing CSV: ${error.message}`);
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length < 2) throw new Error('CSV must have header and data rows');

            const headers = lines[0].split(',').map(h => h.trim());
            const data = {};
            headers.forEach(h => data[h] = []);

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                headers.forEach((h, idx) => {
                    const val = values[idx];
                    data[h].push(isNaN(val) || val === '' ? null : parseFloat(val));
                });
            }

            return data;
        }

        function visualizeTraining(data) {
            const steps = data.step;
            const losses = {
                'Total Loss': data['train/loss'],
                'MSE Loss': data['train/mse_loss'],
                'MSE Context': data['train/mse_context_loss'],
                'MSE Masked': data['train/mse_masked_loss'],
                'MSE Signal': data['train/mse_signal']
            };

            const chartHTML = `
                <div class="charts-section">
                    <div class="chart-container full">
                        <h3>Training Loss Over Steps</h3>
                        <canvas id="lossChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3>Total Loss (smoothed)</h3>
                        <canvas id="smoothedChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3>Learning Rate</h3>
                        <canvas id="lrChart"></canvas>
                    </div>
                </div>
            `;

            document.getElementById('chartsContainer').innerHTML = chartHTML;

            // Main loss chart
            const ctx = document.getElementById('lossChart').getContext('2d');
            const colors = ['#0066cc', '#cc0000', '#ff9900', '#00aa00', '#9900cc'];

            const datasets = Object.entries(losses).map(([name, values], idx) => ({
                label: name,
                data: values,
                borderColor: colors[idx % colors.length],
                backgroundColor: colors[idx % colors.length] + '20',
                borderWidth: 2,
                fill: false,
                tension: 0.3,
                pointRadius: 0,
                pointHoverRadius: 6,
                hitRadius: 20
            }));

            new Chart(ctx, {
                type: 'line',
                data: { labels: steps, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary') }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted') },
                            grid: { color: '#40404040' }
                        },
                        x: {
                            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted') },
                            grid: { color: '#40404040' }
                        }
                    }
                }
            });

            // Smoothed loss (moving average)
            const smoothedLoss = movingAverage(losses['Total Loss'], 50);
            const ctx2 = document.getElementById('smoothedChart').getContext('2d');
            new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: steps,
                    datasets: [{
                        label: 'Total Loss (50-step MA)',
                        data: smoothedLoss,
                        borderColor: '#0066cc',
                        backgroundColor: '#0066cc20',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary') } } },
                    scales: {
                        y: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted') }, grid: { color: '#40404040' } },
                        x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted') }, grid: { color: '#40404040' } }
                    }
                }
            });

            // Learning rate
            const ctx3 = document.getElementById('lrChart').getContext('2d');
            new Chart(ctx3, {
                type: 'line',
                data: {
                    labels: steps,
                    datasets: [{
                        label: 'Learning Rate',
                        data: data['train/lr'],
                        borderColor: '#ff9900',
                        backgroundColor: '#ff990020',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary') } } },
                    scales: {
                        y: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted') }, grid: { color: '#40404040' } },
                        x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted') }, grid: { color: '#40404040' } }
                    }
                }
            });

            // Stats
            const finalLoss = losses['Total Loss'][losses['Total Loss'].length - 1];
            const initialLoss = losses['Total Loss'][0];
            const minLoss = Math.min(...losses['Total Loss'].filter(v => v !== null));
            const lastStep = steps[steps.length - 1];

            const statsHTML = `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">Final Loss</div>
                        <div class="stat-value">${finalLoss.toFixed(4)}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Initial Loss</div>
                        <div class="stat-value">${initialLoss.toFixed(4)}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Improvement</div>
                        <div class="stat-value">${((initialLoss - finalLoss) / initialLoss * 100).toFixed(1)}%</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Best Loss</div>
                        <div class="stat-value">${minLoss.toFixed(4)}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Total Steps</div>
                        <div class="stat-value">${lastStep}</div>
                    </div>
                </div>
            `;

            document.getElementById('statsContainer').innerHTML = statsHTML;
        }

        function movingAverage(arr, window) {
            return arr.map((_, idx) => {
                const start = Math.max(0, idx - window);
                const slice = arr.slice(start, idx + 1);
                return slice.reduce((a, b) => a + (b || 0), 0) / slice.filter(v => v !== null).length;
            });
        }

        function showError(msg) {
            document.getElementById('errorContainer').innerHTML = `<div class="error">${msg}</div>`;
        }
    </script>
</body>
</html>
